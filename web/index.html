<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Replaced by the `--base-href` argument of `flutter build web`.
    Must start and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Client values; scripts/build_web.sh rewrites them for the admin build. -->
  <meta name="description" content="Réserve tes repas pour les événements du club.">
  <meta name="theme-color" content="#0A0425">

  <!-- iOS "Sur l'écran d'accueil" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Repas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Réservation Repas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0A0425; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #F3A916; font: 600 16px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Shown while Flutter downloads (first visit can take a few seconds). -->
  <div id="loading">Chargement…</div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
